<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page's own ground, so a phone's browser chrome matches the app
         rather than framing a light page in near-black. `color-scheme` in the
         stylesheet is `light`, and this has to agree with it. -->
    <meta name="theme-color" content="#f5f7f3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS will not take an SVG here, so this one is a raster of the same mark. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Self-hosted personal accounting: every account in one place, statements that import themselves, and reports that add up."
    />
    <title>Simple Balance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
