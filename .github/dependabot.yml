version: 2
updates:
  # Both npm manifests in one entry, because they are not independent: the
  # runtime manifest mirrors the application one, and `tests/dockerfile.test.ts`
  # fails when they disagree. Watched as two entries, every bump arrived as a
  # pull request touching one of them, which could not go green on its own and
  # never would however many times it was retried. `directories` with a group
  # produces one pull request spanning both, which is the only shape that can
  # pass.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/runtime"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request a week for the routine bumps rather than one per
      # package. Patches and minors get reviewed together or not at all, so
      # splitting them across a dozen pull requests spends attention without
      # buying anything.
      routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Majors are batched separately rather than individually, for the same
      # reason as above: one alone would touch one manifest and stay red. They
      # still arrive apart from the routine bumps, which is where the attention
      # was meant to go.
      majors:
        applies-to: version-updates
        update-types:
          - major
    ignore:
      # These describe the Node the image actually runs, which is the current
      # LTS. Taking a major here lets code typecheck against APIs that are not
      # there at runtime, so it tracks within the major and moves deliberately
      # when the base image does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 1.7 is a minor by its number and a rewrite by its contents. It moves the
      # MCP plugin out into `@better-auth/mcp`, so `mcp`, `withMcpAuth`,
      # `oAuthDiscoveryMetadata` and `oAuthProtectedResourceMetadata` no longer
      # exist on `better-auth/plugins` and the server does not compile. Taking
      # it also means renaming `oauthApplication` to `oauthClient`, two new
      # tables, and an `Account.issuer` backfill — a migration of our own, since
      # every shipped one is frozen.
      #
      # Held rather than left to fail, because better-auth sits in the routine
      # group: an un-takeable member makes every weekly pull request
      # un-mergeable and the safe bumps in it stop arriving. The 1.6 line still
      # comes through, which is the point — 1.6.26 fixed JWT key minting inside
      # a transaction and 1.6.30 an async-storage race on cold start, both of
      # which this deployment meets. Lift this in the change that does the
      # migration, not before.
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]

  # Docker exists here because every base is now pinned by digest, and a pin
  # nothing watches is a base frozen on the security patches it had the day
  # somebody typed it — worse than the floating tag it replaced. `directories`
  # covers the single container at the root and the three split images, and one
  # group keeps them to a single pull request: all four share `node:24-alpine`,
  # so four separate bumps would be four reviews of one decision.
  #
  # A bump also has to move the `org.opencontainers.image.base.digest` label in
  # the same file, which Dependabot cannot do. `tests/dockerfile.test.ts` fails
  # until it is done rather than letting an image ship claiming a base it was
  # not built on, so the pull request says what is left to do instead of being
  # merged half-finished.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      bases:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
