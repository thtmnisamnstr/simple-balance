name: release

# Publishing keys off the release itself rather than off the tag push that may
# or may not accompany it. Cutting a release in the GitHub UI, with `gh release
# create`, or by publishing a draft all raise this one event, and each raises it
# exactly once, so an image is never published twice or, worse, not at all.
#
# `workflow_dispatch` is here to re-publish an existing release without cutting
# a new one, which is what you want when a publish failed for a reason that had
# nothing to do with the code.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string
      latest:
        description: "Also move the `latest` tag on to this release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One publish at a time for the whole repository, not one per tag. Grouping by
# tag put two releases in two groups, so both could be pushing when both wanted
# `latest`, and which one ended up holding it came down to ordering. Not
# per-job: a job-level group is evaluated once per matrix leg, so all four legs
# of one run would queue behind each other.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # Which tag is being published is settled before anything is tested, so the
  # gates can be pointed at it. A dispatched re-publish starts from a branch
  # rather than from the tag, and testing the branch while shipping the tag is
  # the one combination that can put an unverified image on the registry.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          MARKED_PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT: ${{ github.event_name }}
          WANTS_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Release tag $TAG must look like v1.2.3" >&2; exit 1 ;;
          esac
          # This value becomes a git ref, an image tag, and part of a shell
          # command, so anything beyond a version is refused here rather than
          # carried into all three.
          case "$TAG" in
            *[!A-Za-z0-9.+-]*)
              echo "Release tag $TAG contains unexpected characters" >&2
              exit 1
              ;;
          esac
          version="${TAG#v}"

          # A prerelease is one GitHub marked as such, or one whose version
          # carries a suffix. Either way it publishes its own tag and leaves
          # `latest` where it is.
          #
          # A dispatch has no release object to consult, so it cannot see the
          # marking. Left to infer, it read an unsuffixed version marked
          # prerelease in the UI as final and moved `latest` on to it. So a
          # dispatch never moves `latest` unless it was asked to, in so many
          # words, by the person running it.
          prerelease=false
          if [ "$EVENT" = "release" ]; then
            prerelease="${MARKED_PRERELEASE:-false}"
          elif [ "$WANTS_LATEST" != "true" ]; then
            prerelease=true
          fi
          case "$version" in
            *-*) prerelease=true ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            # GHCR rejects an uppercase path, and a repository name is free to
            # contain one.
            echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

          # The commit, settled once. Checking out by tag name twice let a tag
          # moved between the two jobs verify one commit and ship another, which
          # is the single way an unverified image reaches the registry.
          #
          # Shape-checked before it leaves this step, like the tag above. This
          # value becomes the ref two jobs check out, and a response body is not
          # something to hand to `git checkout` unread however trustworthy the
          # host.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          case "$sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Could not resolve $TAG to a commit" >&2; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The same gates every pull request runs, against the exact commit being
  # shipped. A tag can never ship an image that would have failed them.
  verify:
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: publish ${{ matrix.name }}
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing must not cancel a push already under way in another.
      # Four that all failed is a state somebody can describe; three cancelled
      # halfway through is not.
      fail-fast: false
      matrix:
        # The single container publishes under the name it has always had, with
        # no suffix, so nothing already on the registry changes meaning. The
        # decomposed images hang off it by suffix, which is what the Helm chart
        # and the deployment guide already call them.
        include:
          - name: single
            suffix: ""
            dockerfile: Dockerfile
          - name: server
            suffix: -server
            dockerfile: deploy/docker/server.Dockerfile
          - name: frontend
            suffix: -frontend
            dockerfile: deploy/docker/frontend.Dockerfile
          - name: scheduler
            suffix: -scheduler
            dockerfile: deploy/docker/scheduler.Dockerfile
    env:
      # Named once so the build and the check after it cannot disagree about
      # what was supposed to ship, or about where it went.
      PLATFORMS: linux/amd64,linux/arm64
      IMAGE: ${{ needs.resolve.outputs.image }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check the tag against the manifest
        # Read as environment variables rather than pasted into the script, so
        # the shell sees values rather than something it might interpret.
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$package_version" ]; then
            echo "Release $TAG does not match package.json version $package_version." >&2
            echo "Run: npm run set-version $VERSION" >&2
            exit 1
          fi

      # Registers the emulators that let an amd64 runner build the arm64 image.
      # Some builder images happen to bundle them, which is why this has worked
      # without it, but relying on that leaves the arm64 half of every release
      # depending on something nobody declared.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: ${{ env.PLATFORMS }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are stated outright rather than inferred from the git ref, so a
      # dispatch run publishes the same version tag a release run does. Whether
      # it also moves `latest` is the one difference, and it is asked for
      # explicitly, because a dispatch cannot see the release's prerelease mark.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.prerelease == 'false' }}
          # Both are stated rather than derived. metadata-action reads the
          # licence from what GitHub detected, which is the deprecated
          # `AGPL-3.0` rather than the `AGPL-3.0-only` this repository and the
          # Dockerfile both state, and its labels are applied after the
          # Dockerfile's own, so it wins. v0.1.0 shipped carrying the derived
          # one.
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Four builds now run at once and the gha backend keys on one scope
          # unless told otherwise, so without a scope each they would overwrite
          # each other's cache and every release would start cold.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A single-architecture publish looks like a success: the push works, the
      # tag resolves, and it only fails later on somebody else's machine. So the
      # manifest that was actually pushed is read back and checked.
      - name: Check every architecture reached the registry
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$VERSION"
          published="$(docker buildx imagetools inspect "$ref" \
            --format '{{range .Manifest.Manifests}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "Published: $published"
          missing=""
          for want in $(echo "$PLATFORMS" | tr ',' ' '); do
            case " $published " in
              *" $want "*) ;;
              *) missing="$missing $want" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "Missing from the published manifest:$missing" >&2
            exit 1
          fi
          echo "Published for:$published"

      - name: Say what was published
        run: |
          echo "### Published \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Architectures: \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
