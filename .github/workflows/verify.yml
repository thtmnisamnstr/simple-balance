name: verify

# These gates answer one question: is this safe to merge into main. So they run
# on pull requests, which covers opening one and every push to its branch, and
# not on every push to every branch a person happens to be experimenting on.
on:
  pull_request:
  # The release workflow reuses these gates so a publish cannot outrun them.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The README promises PostgreSQL 15 and up, so the oldest supported server
      # is tested rather than assumed.
      matrix:
        postgres: ["15-alpine", "16-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple_balance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simple_balance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simple_balance_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - if: matrix.postgres == '16-alpine'
        run: docker build -t simple-balance:test .
