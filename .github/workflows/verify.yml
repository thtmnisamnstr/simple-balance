name: verify

# These gates answer one question: is this safe to merge into main. So they run
# on pull requests, which covers opening one and every push to its branch, and
# not on every push to every branch a person happens to be experimenting on.
on:
  pull_request:
  # The release workflow reuses these gates so a publish cannot outrun them.
  # It passes the commit its resolve job settled on rather than the tag name, so
  # verify and publish cannot end up checking out different trees if the tag
  # moves between them. The ref matters because a reusable workflow called from
  # this repository always runs the definition at the caller's ref, and a
  # dispatched re-publish is started from a branch rather than from the tag.
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch, or tag to test. Defaults to the caller's."
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The README promises PostgreSQL 15 and up and Node 22.22.2 and up, so
      # the oldest of each is tested rather than assumed. The image ships Node
      # 24; 22 is here because `npm start` on a host is a supported way to run
      # this and the manifest says it works.
      matrix:
        postgres: ["15-alpine", "16-alpine"]
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple_balance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simple_balance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simple_balance_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The cache is used only where the ref is this repository's own. A release
      # calls this workflow with a ref of its own choosing, and everything after
      # the checkout then runs code from that ref with write access to a cache the
      # default branch reads — which is the whole of the cache-poisoning problem.
      # A pull request has no such input, so it keeps the cache and the speed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.ref == '' && 'npm' || '' }}
      - run: npm ci
      # TEST_DATABASE_URL is set for the whole job, so the suite `verify` runs
      # already includes the integration tests. It is unset here so that step
      # stays the fast one it is meant to be, and the integration suite runs
      # once, in the step below. That step cannot go green having skipped
      # everything: the suite itself refuses to run in CI without a database,
      # which is a guarantee that belongs with the tests rather than in a shell
      # line here.
      - run: npm run verify
        env:
          TEST_DATABASE_URL: ""
      - run: npm run test:integration

  # The browser tier, on one combination rather than on the matrix. It starts
  # three processes and drives Chromium, so it is the slowest thing here and the
  # only one that proves the whole stack: the four deprecated route aliases are
  # checked nowhere else, and the argument that 0.1.5 upgrades cleanly to this
  # release rests on them. It was written and then never run by anything but a
  # person, which is how two of its assertions came to be pinning a header value
  # the code had stopped sending.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple_balance_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simple_balance_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BROWSER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simple_balance_browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: ${{ inputs.ref == '' && 'npm' || '' }}
      - run: npm ci
      # The browser only, rather than `--with-deps`: the runner image already
      # carries the system libraries, and installing them again is a minute per
      # run for nothing.
      - run: npx playwright install chromium
      # `list` rather than the HTML report: a failure prints the assertion and
      # the trace path in the log, and uploading the report would mean pinning
      # another action by digest for something the log already says.
      - run: npm run test:browser

  # The chart and the Pulumi programs ship in the release, so a change that
  # breaks either should fail here rather than at somebody's `helm install`.
  # Neither is covered by `npm run verify`: the chart is YAML the TypeScript
  # build never sees, and the programs are a separate npm project outside the
  # root workspace.
  deploy:
    name: deployment material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # helm through its own image, pinned by digest, rather than a setup
      # action: it is one more thing to keep pinned and this needs helm for two
      # commands. The digest is the tag's, recorded so a moved tag cannot change
      # what runs here.
      - name: Lint and render the chart
        env:
          HELM: alpine/helm@sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b
        run: |
          set -euo pipefail
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" "$HELM" "$@"; }
          helm lint /charts/simple-balance
          # Rendered with values that satisfy every required guard, because a
          # chart that lints can still fail to template.
          helm template release /charts/simple-balance \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=0123456789012345678901234567890123456789 \
            --set config.appBaseUrl=https://books.example.org \
            --set ingress.enabled=true \
            --set ingress.host=books.example.org > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"
          # Off at default values, so the render above never reached this
          # template and a break in it would have shipped. Rendered separately
          # and checked by kind, because a template that produces nothing also
          # produces no error.
          helm template release /charts/simple-balance \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=0123456789012345678901234567890123456789 \
            --set config.appBaseUrl=https://books.example.org \
            --set networkPolicy.enabled=true > /tmp/rendered-netpol.yaml
          grep -q 'kind: NetworkPolicy' /tmp/rendered-netpol.yaml
          echo "rendered the NetworkPolicy"

      # The guards are the reason a misconfigured install fails at render rather
      # than as a crashlooping pod, so a release must not be able to lose them
      # quietly. Each has to refuse, and the run fails if one renders.
      - name: The chart refuses what it should refuse
        env:
          HELM: alpine/helm@sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b
        run: |
          set -euo pipefail
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" "$HELM" "$@"; }
          # The message matters as much as the exit code. Checking only that the
          # render failed passes when it failed for some other reason, so a
          # deleted guard reads as "refused" while nothing is guarding anything.
          # Every case therefore supplies the values it is not testing.
          refuses() {
            local what="$1"; local fragment="$2"; shift 2
            local output
            if output=$(helm template release /charts/simple-balance "$@" 2>&1); then
              echo "::error::the chart rendered $what instead of refusing it"
              exit 1
            fi
            if ! printf '%s' "$output" | grep -qF "$fragment"; then
              echo "::error::the chart refused $what, but not for the stated reason"
              printf '%s\n' "$output"
              exit 1
            fi
            echo "refused: $what"
          }
          refuses "a missing DATABASE_URL" "secret.databaseUrl is required" \
            --set secret.authSecret=0123456789012345678901234567890123456789 \
            --set config.appBaseUrl=https://books.example.org
          refuses "a missing AUTH_SECRET" "secret.authSecret is required" \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set config.appBaseUrl=https://books.example.org
          refuses "an AUTH_SECRET too short to sign with" "at least 32 characters" \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=short \
            --set config.appBaseUrl=https://books.example.org
          refuses "the placeholder secret it ships" "published placeholders" \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=replace-with-at-least-32-random-characters \
            --set config.appBaseUrl=https://books.example.org
          refuses "the placeholder origin it ships" "config.appBaseUrl" \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=0123456789012345678901234567890123456789
          refuses "a plaintext origin outside loopback" "config.appBaseUrl" \
            --set secret.databaseUrl=postgresql://user:pass@db:5432/simple_balance \
            --set secret.authSecret=0123456789012345678901234567890123456789 \
            --set config.appBaseUrl=http://books.example.org

      # The `single` profile's material, which no unit test can run: a compose
      # file is only known to interpolate once Compose has interpolated it, a
      # systemd unit is only known to parse once systemd has parsed it, and a
      # shell script that is written into cloud-init is only known to be a shell
      # script once a shell has read it. All three are cheap here and silent
      # everywhere else — the frontend image's nginx template shipped a fatal
      # error for exactly this reason, because every check read it as text.
      # Same reasoning as the verify job above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ inputs.ref == '' && 'npm' || '' }}
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Typecheck the Pulumi programs
        working-directory: deploy/pulumi
        run: |
          npm ci
          npm run typecheck

  # Its own job, and the reason is a CodeQL finding rather than tidiness.
  #
  # actions/cache-poisoning/poisonable-step reports a step that runs content
  # out of the checkout in a job that also writes a cache, where the trigger
  # can write the default branch's cache scope — which this workflow's can,
  # because release.yml dispatches it and calls in with an `inputs.ref` naming
  # a tree that is not this one.
  #
  # `deploy` above sets up Node for the Pulumi typecheck and caches npm for it.
  # It already declines to cache when called with a ref, which is the real
  # mitigation, but that lives inside an expression CodeQL cannot evaluate. The
  # step below needs no Node, no npm and no cache, so the honest answer is a
  # job with none of them rather than an argument about a job that has them.
  #
  # Moving it to sit after `npm ci` was tried first and did not clear it: the
  # query is not about ordering. `npm ci` is not reported because it is not one
  # of the patterns it recognises, which makes the finding a false positive in
  # substance — nothing here executes what it reads. `sh -n` parses without
  # running, `docker compose config` interpolates, `systemd-analyze verify`
  # parses. The separation costs one job and settles it.
  profile:
    name: single profile material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: The single profile's material is what it claims to be
        run: |
          set -euo pipefail
          cd deploy/compose/single
          # The guards are the point of the exercise, so supply what they ask
          # for rather than what a real deployment would use.
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci
          AUTH_SECRET=0123456789012345678901234567890123456789
          APP_BASE_URL=https://books.example.org
          SITE_ADDRESS=books.example.org
          ENV
          docker compose -f compose.yml config >/dev/null
          echo "compose.yml interpolates"
          docker compose -f compose.yml -f compose.caddy.yml config >/dev/null
          echo "the Caddy overlay interpolates"
          # The overlay's whole job: the application starts believing
          # X-Forwarded-For because something is now in front of it.
          docker compose -f compose.yml -f compose.caddy.yml config \
            | grep -q 'TRUST_PROXY: "true"'
          echo "the overlay turns TRUST_PROXY on"
          # And that each required setting is genuinely required, since a `:?`
          # that was softened to `:-` is invisible until somebody deploys
          # without it.
          for name in POSTGRES_PASSWORD AUTH_SECRET APP_BASE_URL; do
            if grep -v "^$name=" .env > .env.missing && \
               docker compose --env-file .env.missing -f compose.yml config >/dev/null 2>&1; then
              echo "::error::compose.yml rendered without $name instead of refusing"
              exit 1
            fi
            echo "refused without $name"
          done
          rm -f .env .env.missing
          cd ../../..
          # Fail loudly rather than skip. The first spelling of this check used
          # `|| true` and printed "parsed" for every unit on an image where the
          # binary was absent — a check that could not fail, which is the one
          # kind this repository refuses to keep.
          command -v systemd-analyze >/dev/null || {
            echo "::error::systemd-analyze is not installed, so the units were not checked"
            exit 1
          }
          for unit in deploy/systemd/*.service deploy/systemd/*.timer; do
            # The exit code is no use in either direction, which was measured
            # rather than assumed: it is 1 for these units on any machine
            # without docker.service, and it is 0 for a unit carrying an unknown
            # directive. What systemd prints is the signal, so the two
            # environment complaints are filtered and anything left is a defect.
            complaints=$(systemd-analyze verify "$unit" 2>&1 \
              | grep -v 'Unit .* not found' \
              | grep -v 'is not executable: No such file or directory' || true)
            if [ -n "$complaints" ]; then
              echo "::error::$unit did not parse cleanly"
              echo "$complaints"
              exit 1
            fi
            echo "parsed $unit"
          done
          for script in deploy/systemd/simple-balance-backup deploy/systemd/simple-balance-restore; do
            sh -n "$script"
            echo "parsed $script"
          done



  # A Dockerfile that has stopped building should fail the pull request that
  # broke it rather than the release that needed it. Its own job rather than
  # more steps on the one above: that one is multiplied by every PostgreSQL and
  # Node version, so four builds there are either sixteen builds for one answer
  # or four in series behind an `if` pinning them to a single combination.
  images:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simple-balance
            dockerfile: Dockerfile
          - image: simple-balance-server
            dockerfile: deploy/docker/server.Dockerfile
          - image: simple-balance-frontend
            dockerfile: deploy/docker/frontend.Dockerfile
          - image: simple-balance-scheduler
            dockerfile: deploy/docker/scheduler.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # One architecture, the runner's own, and no push. The question here is
      # whether the image still builds at all; the release workflow is where
      # every architecture it ships on is proved, and emulating one costs
      # minutes a pull request has no use for.
      - env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t "$IMAGE:test" .

      # Building the frontend image proves nothing about its nginx
      # configuration: the config is a template rendered by the entrypoint, and
      # a malformed `add_header` or a location-scoped directive in the wrong
      # include is a startup error rather than a build error. So this one image
      # is started and asked for a page. `tests/security-header-parity.test.ts`
      # checks the include against the API's middleware; this checks that nginx
      # accepts it and that the headers reach a real response.
      - name: The frontend image serves the shell with its policy on it
        if: matrix.image == 'simple-balance-frontend'
        run: |
          set -euo pipefail
          # nginx's own reason for refusing is the useful output here, and every
          # check below exits on failure, so the logs are printed on the way out
          # rather than after the last assertion.
          trap 'docker logs frontend-probe || true; docker rm -f frontend-probe || true' EXIT
          # A resolvable upstream, because nginx refuses to start on a proxy_pass
          # host it cannot resolve. Nothing answers on it and nothing needs to:
          # only files nginx serves itself are being asked for.
          docker run -d --name frontend-probe \
            -e SB_API_ORIGIN=http://127.0.0.1:3000 \
            -p 127.0.0.1:8099:8080 simple-balance-frontend:test
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/; then break; fi
            sleep 1
          done
          shell_headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8099/)
          asset=$(curl -fsS http://127.0.0.1:8099/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$asset"
          asset_headers=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8099$asset")
          for header in \
            "content-security-policy" \
            "x-content-type-options" \
            "x-frame-options" \
            "referrer-policy" \
            "cross-origin-opener-policy" \
            "cross-origin-resource-policy" \
            "origin-agent-cluster" \
            "x-dns-prefetch-control" \
            "x-download-options" \
            "x-permitted-cross-domain-policies" \
            "x-xss-protection" \
            "strict-transport-security"; do
            # Both, because the include is repeated per static location and
            # nginx drops inherited add_header from any level with one of its
            # own. Losing it from the assets location alone would be silent.
            printf '%s' "$shell_headers" | grep -qi "^$header:" \
              || { echo "::error::the shell is missing $header"; exit 1; }
            printf '%s' "$asset_headers" | grep -qi "^$header:" \
              || { echo "::error::a hashed asset is missing $header"; exit 1; }
          done
          echo "the shell and a hashed asset both carry all twelve headers"

          # And the one page whose policy differs. Rendering it is the part a
          # test cannot do: nginx takes a static response's Content-Type from
          # the request path, and `/settings/plan` has no extension, so the
          # wrong directive serves the application as a file download that no
          # browser executes. Both spellings, because the client router renders
          # the tab for either and a location catching one would serve the other
          # under the strict policy.
          for path in /settings/plan /settings/plan/; do
            plan=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8099$path")
            printf '%s' "$plan" | grep -qi "^content-type: text/html" \
              || { echo "::error::$path is not served as text/html"; exit 1; }
            # Stripe is not configured on this container, so that page must come
            # back under exactly the policy every other page gets.
            printf '%s' "$plan" | grep -qi "js.stripe.com" \
              && { echo "::error::$path carries the Stripe policy with no Stripe configured"; exit 1; }
          done
          echo "the plan page renders under the strict policy in both spellings"

          docker rm -f frontend-probe
          # Again with Stripe configured, which is the case the wider policy
          # exists for and the only one in which the payment form can load.
          docker run -d --name frontend-probe \
            -e SB_API_ORIGIN=http://127.0.0.1:3000 \
            -e SB_BILLING_CONFIGURED=true \
            -p 127.0.0.1:8099:8080 simple-balance-frontend:test
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/; then break; fi
            sleep 1
          done
          for path in /settings/plan /settings/plan/; do
            plan=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8099$path")
            printf '%s' "$plan" | grep -qi "^content-security-policy:.*js.stripe.com" \
              || { echo "::error::$path does not carry the Stripe policy"; exit 1; }
          done
          # And every other page keeps the strict one, which is the promise the
          # whole surface split rests on.
          curl -fsS -D - -o /dev/null http://127.0.0.1:8099/accounts | grep -qi "js.stripe.com" \
            && { echo "::error::the Stripe policy leaked onto an ordinary page"; exit 1; }
          echo "the plan page carries the Stripe policy and no other page does"
