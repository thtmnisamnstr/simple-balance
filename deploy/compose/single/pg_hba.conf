# Who may connect to the database machine of the `single` profile, and how.
#
# Mounted read-only into the container and named by `-c hba_file=` in
# compose.postgres.yml, so the server reads this file and ignores the one initdb
# wrote into the data directory. That is the point: the image's generated rules
# end in `host all all all scram-sha-256`, which accepts an *unencrypted*
# connection that authenticates. Every line here that crosses a network says
# `hostssl`, so the server refuses a plaintext connection rather than the client
# having to remember to ask for TLS.
#
# Four columns: TYPE  DATABASE  USER  ADDRESS  METHOD. Order matters — the first
# line that matches decides, and there is no fall-through to a later one.

# The container's own Unix socket, for the entrypoint. initdb, the temporary
# server that runs the scripts in /docker-entrypoint-initdb.d, and anyone who
# has reached `docker compose exec postgres psql` already have the data
# directory and the server's key; a password between them and the cluster would
# be a formality.
local   all             postgres                                trust

# The same socket, for the application's own role, and this line is what makes
# `simple-balance-backup` and `simple-balance-restore` work when they are run
# on this machine. Both find `postgres` in this project's service list and dump
# through `docker compose exec`, as `simple_balance` — and without this line
# every one of them fails with `no pg_hba.conf entry for host "[local]"`. It
# was missing for exactly as long as it took to run the backup script against a
# real server, which is the only way that class of gap is ever found.
#
# As the application's role rather than as the superuser, deliberately, and the
# reason is the *restore* rather than the dump: `pg_restore --no-owner` gives
# every object it creates to the role that connected. Taking the easier route
# and dumping as `postgres` would hand a restored ledger to `postgres`, and the
# application — which is `simple_balance` — could then read none of its own
# tables. A backup that restores into a database the application cannot use is
# not a backup.
#
# `trust`, like the line above, and it grants strictly less: reaching this
# socket at all means `docker compose exec` on this machine, which is already
# the superuser line above. A password here would be one more secret to keep so
# that somebody who is already root can be asked for it.
#
# Narrowed to the one database, so it is not a second way into the cluster.
local   simple_balance  simple_balance                          trust

# The health check, and nothing else. 127.0.0.1 is inside this container's
# network namespace: the published port reaches the container on its bridge
# address, so a packet from the application machine — or from anywhere — never
# arrives with this source. It grants no authority the line above has not
# already granted to the same processes.
#
# `host` rather than `hostssl`, and `trust` rather than a password, because the
# alternative is worse than it looks: the `pg_isready -h 127.0.0.1` in
# compose.postgres.yml is answered by the server before authentication either
# way, so a line that refuses it produces a health check that still passes and
# a `no pg_hba.conf entry` in the log every ten seconds. A real failure would
# then be one line among three hundred thousand.
host    all             postgres        127.0.0.1/32            trust

# The application, over TLS, as an unprivileged role, into its own database.
#
# `hostssl` is the whole of the encryption-in-transit guarantee on this hop: it
# is the server refusing, which is the only half that cannot be forgotten. If
# the `-c ssl=on` flags are ever dropped from compose.postgres.yml this line
# stops matching and the application cannot connect at all — a loud failure,
# deliberately, rather than a quiet fallback to plaintext.
#
# The address is `all`, and that is a decision with two reasons rather than an
# omission. The packet-level boundary is the provider's firewall, which opens
# 5432 to the application node alone, and the published port, which binds this
# machine's private address; an address written here as well is a third copy
# that can disagree with the two that actually carry traffic. And a file in this
# repository cannot know the address of a subnet somebody's Pulumi stack chose.
#
# So the machines deploy/pulumi builds narrow it anyway:
# simple-balance-db-firstboot rewrites `all` on this one line to SB_APP_CIDR
# when /etc/default/simple-balance sets it, which is the third line of defence
# and costs a hand install nothing.
hostssl simple_balance  simple_balance  all                     scram-sha-256

# Nothing else. No superuser over the network, no other database, no other role,
# and no `host` line that would take a plaintext connection. A rule that is not
# written here is refused, which is the default this file exists to restore.
