# Simple Balance's application machine: everything but the database.
#
# The application container docs/deployment.md calls the supported way to run
# this, and — only when the `metrics` profile is on — the two services at the
# bottom of this file that watch it. No PostgreSQL here, and that is the point
# of the machine rather than a gap in it — losing this one loses no data. Point
# DATABASE_URL at the database machine beside it, which compose.postgres.yml in
# this same directory runs, or at a managed service, or at a server you already
# keep.
#
#   install -m 0600 deploy/compose/single/.env.example deploy/compose/single/.env
#   $EDITOR deploy/compose/single/.env
#   docker compose -f deploy/compose/single/compose.yml up -d
#
# This is the `single` profile, and the name is about *shape* rather than about
# a machine count: one application node, one database node, no redundancy in
# either, and it grows by being given more CPU and memory. The other profile is
# `ha`, which is the Helm chart, in two shapes of its own.
# docs/deployment-profiles.md is the comparison, docs/deployment-sizing.md says
# how big each machine has to be, and docs/deployment-costs.md prices the pair.
#
# Not to be confused with ../compose.distributed.yml, which runs the *split*
# containers on one machine. That file exists to exercise the shape the Helm
# chart deploys; this one is a deployment somebody's books live in.
name: simple-balance

services:
  app:
    # The one container: the API, the MCP server, the browser bundle and the
    # recurrence scheduler. RECURRENCE_SCHEDULER is deliberately not passed
    # below: this is the only process there is, so turning it off would leave
    # recurrences that never propose.
    # Pinned rather than :latest, because an upgrade moves the schema and should
    # be a decision rather than whatever a restart happened to pull.
    image: ghcr.io/thtmnisamnstr/simple-balance:0.2.1
    restart: unless-stopped
    ports:
      # Loopback, always, and the bind address is what makes that true — not the
      # Caddy overlay.
      #
      # This comment said for a release that compose.caddy.yml "removes this
      # mapping entirely". It does not: an overlay merges lists rather than
      # replacing them, so with Caddy in front the application is published on
      # 127.0.0.1:3000 as well. That was harmless, because the address below is
      # loopback — but it was harmless by accident, and the argument for not
      # opening 3000 in either cloud firewall was resting on it.
      #
      # So the property to keep is this one: whatever is in front, the port is
      # published to this machine and to nothing else. Publishing 3000 to
      # 0.0.0.0 would serve the application over plain HTTP to anybody who found
      # the address, with the session cookie on it, and neither cloud program
      # opens 3000 to anything.
      #
      # `ports: !override []` in the Caddy overlay would drop the mapping
      # properly and is deliberately not used: it needs Compose 2.24, this file
      # is also a hand install recipe, and a YAML tag an older Compose does not
      # know is a parse error rather than a fallback. Keeping the mapping also
      # keeps `curl 127.0.0.1:3000/health/ready` working on the machine, which is
      # the first thing anybody does when the site is down.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"

    # The whole of what reaches the container: .env only fills in the ${...},
    # so a setting this block does not name is silently dropped.
    # tests/env-example.test.ts holds it to every name src/server reads.
    environment:
      # Set by the image already. Pinned here because unset reads as development
      # and that is the one misconfiguration with no symptom: no setup code, no
      # sign-in rate limiting, no secure cookies, and nothing said about it.
      NODE_ENV: production

      # Never this machine's own PostgreSQL, and that is the profile rather
      # than a limitation: losing this machine loses no data.
      #
      # Where the database lives is the one thing this file does not decide. On
      # the pair deploy/pulumi builds it is the database node, over the
      # provider's private network, under sslmode=verify-full against a
      # certificate that stack issued. It can equally be a managed service or a
      # server you already keep awake. `docs/deployment.md` has always described
      # this product as something you point at a database, and this is that
      # sentence as a compose file.
      #
      # A URL that names the database's CA certificate with sslrootcert needs
      # compose.db-tls.yml beside this file, which mounts the certificate's
      # directory. It is left out of here because a daemon that cannot make
      # that directory, a rootless one, would then start nothing at all.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/compose/single/.env}
      # Only behind a transaction pooler, which managed services often hand
      # out. Migrations and the first-account claim hold a session-level
      # advisory lock that a pooler cannot carry, so they connect here instead.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}

      # The origin a browser opens, which behind a terminator is its https:// URL
      # and not this container's port. The API sets the cookies the browser reads
      # and compares every state-changing request's Origin against this value, so
      # naming the wrong host here turns every write into a rejected
      # cross-origin request while the pages still load.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in deploy/compose/single/.env}

      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/compose/single/.env}
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Whether to believe X-Forwarded-For. There is no nginx in this profile —
      # the application serves its own pages — so the header comes from whatever
      # terminates TLS, and the API reads the first address in it.
      #
      # Defaulted to false and overridden to true by compose.caddy.yml, because
      # the answer is a property of what is in front rather than of this file.
      # Left true with nothing in front, a caller writes their own address and
      # gets as many sign-in attempts as they like; left false with something in
      # front, every visitor shares one allowance. The server says at startup
      # which of the two it is doing.
      TRUST_PROXY: ${TRUST_PROXY:-false}

      SMTP_HOST: ${SMTP_HOST:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"

      CSV_MAX_BYTES: "10485760"
      CSV_MAX_ROWS: "10000"

      # One process, so this deployment opens 10 + 1 = 11 of whatever
      # max_connections the database at DATABASE_URL allows. That is all this
      # profile ever asks of it: there is nothing to scale out, so the number
      # does not move unless the pool does.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

      RECURRENCE_TICK_SECONDS: "300"
      RECURRENCE_CATCH_UP_LIMIT: "50"
      RECURRENCE_CLAIM_LIMIT: "500"
      IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-}

      # Off unless asked for, and never public. The Caddyfile refuses /metrics
      # before it proxies anything, so the one way in is the loopback port
      # above, which is how the `collector` service below reaches it from the
      # host's network. That took a fix: for a release the Caddyfile proxied
      # every path while this comment said no terminator here did, so turning
      # this on without a token published it. A terminator of your own has to
      # refuse it the same way. METRICS_TOKEN is still worth setting: the
      # collector sends it as a bearer token, and nothing else on the machine
      # then reads the numbers.
      #
      # An export endpoint turns this on by itself on a machine a cloud
      # program built, because simple-balance-env writes METRICS_ENABLED=true
      # into .env when the stack sets SB_METRICS_EXPORT_ENDPOINT and not this.
      # By hand it is set beside the profile; .env.example has the three
      # together. This line cannot derive it: `:+true` nested inside this
      # default renders empty when neither is set, and the server refuses an
      # empty METRICS_ENABLED, so the deployment that set nothing would be the
      # one that stopped starting.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      SB_BILLING_ENABLED: ${SB_BILLING_ENABLED:-false}
      SB_CSP_REPORT_ONLY: ${SB_CSP_REPORT_ONLY:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY_ID: ${STRIPE_PRICE_MONTHLY_ID:-}
      STRIPE_PRICE_YEARLY_ID: ${STRIPE_PRICE_YEARLY_ID:-}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_BANNER_SLOT_ID: ${ADSENSE_BANNER_SLOT_ID:-}
      ADSENSE_FOOTER_SLOT_ID: ${ADSENSE_FOOTER_SLOT_ID:-}
      ADSENSE_CONSENT_MANAGED: ${ADSENSE_CONSENT_MANAGED:-false}
      SB_HOUSE_AD: ${SB_HOUSE_AD:-false}
      # Optional, and linked from sign-in and every page whenever it is set;
      # required, as an absolute https:// address, the moment the AdSense ids
      # are set: the server refuses to start without it. This block once left
      # it out, so the value in .env never arrived and turning AdSense on took
      # the whole deployment down asking for a variable already set.
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      # Optional, the same shape, linked beside the policy and the renewal terms.
      TERMS_OF_USE_URL: ${TERMS_OF_USE_URL:-}

    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    # Longer than the 10s the process gives itself on SIGTERM
    # (DEFAULT_SHUTDOWN_DEADLINE_MS), so a restart is not killed mid-drain.
    stop_grace_period: 30s

    # Docker's default json-file driver keeps every line forever, and on a
    # machine whose boot disk is 20 GiB that is how the disk fills. Both numbers
    # are per container, and compose.caddy.yml repeats them for Caddy.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      # The first start against an empty database runs every migration under an
      # advisory lock before readiness opens. Kept in step with the chart's
      # startupProbe and the distributed recipe's start_period: whichever is
      # smallest decides how slow a first migration may be before somebody's
      # deployment restarts in the middle of one.
      start_period: 300s
      retries: 5

  # ---------------------------------------------------------------- metrics ---
  #
  # The two services below start only when the `metrics` profile is on, and
  # with it off this file runs exactly what it ran before they existed:
  # `docker compose config --services` names `app` alone. They watch the
  # machine and the application and send what they read to one backend, which
  # SB_METRICS_EXPORT_ENDPOINT names; collector.yaml beside this file says what
  # is scraped and how it is sent.
  #
  # The profile is the switch and the endpoint is the setting, and on a machine
  # a cloud program built simple-balance-env turns one into the other: an
  # endpoint in the stack's settings writes COMPOSE_PROFILES=metrics into .env,
  # with METRICS_ENABLED=true above, unless .env already names either. A hand
  # install sets all three in .env itself.
  #
  # Turning it off by hand is `docker compose --profile metrics down` before
  # the profile leaves .env, because a `down` that does not name a profile
  # leaves that profile's containers running. The unit's ExecStop runs before
  # simple-balance-env rewrites .env, so on a cloud machine the `down` still
  # names it.
  #
  # Both run on the host's network rather than this project's, and the reason
  # is node-exporter's: a network namespace of its own would report the traffic
  # of that namespace — its own one interface — as the machine's, and the host's
  # network is the only place the machine's own NIC is visible. The collector
  # then has to be there too, to reach a listener that is on loopback so that
  # nothing off the machine can. Neither publishes a port, both listen on
  # 127.0.0.1 alone, and nothing about the application's own network changes.
  #
  # What the host's network does hand them is the instance metadata address,
  # and on either cloud what answers there is the machine's identity, which
  # reads every stack secret. On AWS a hop limit of 1 keeps containers from it,
  # and a container on the host's network is no hop away; Oracle Cloud has no
  # hop limit at all. So both programs refuse 169.254.169.254 to the users
  # below — IMDS_BLOCK in deploy/pulumi/single-common/cloud-init.ts, run at
  # every boot on AWS and saved with the host firewall on Oracle Cloud — and a
  # hand install on a cloud machine wants the same rule.
  collector:
    # The core distribution, which has the Prometheus receiver, both
    # exporters and nothing this needs beyond them: smaller than contrib, and
    # measured at 51.7 MiB resident where contrib took 79.6 and Prometheus in
    # agent mode 72.3 with a write-ahead log to keep somewhere. Pinned by tag
    # and by digest, so the image a machine pulls is the one that was measured
    # and a re-pushed tag cannot change it.
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    profiles: ["metrics"]
    restart: unless-stopped
    network_mode: host
    # Each name collector.yaml reads, and nothing it does not. Defaults here
    # rather than in .env, beside the reason; SB_METRICS_EXPORT_HEADERS
    # carries the backend's credential, so it lives with the secrets.
    environment:
      SB_METRICS_EXPORT_ENDPOINT: ${SB_METRICS_EXPORT_ENDPOINT:-}
      SB_METRICS_EXPORT_PROTOCOL: ${SB_METRICS_EXPORT_PROTOCOL:-otlp}
      SB_METRICS_EXPORT_HEADERS: ${SB_METRICS_EXPORT_HEADERS:-}
      SB_METRICS_SCRAPE_INTERVAL: ${SB_METRICS_SCRAPE_INTERVAL:-30s}
      SB_METRICS_ENVIRONMENT: ${SB_METRICS_ENVIRONMENT:-production}
      SB_METRICS_DATABASE_TARGET: ${SB_METRICS_DATABASE_TARGET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Where the application is published, read from the same two settings
      # its `ports:` line is, so the scrape follows the port wherever it moves.
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      APP_PORT: ${APP_PORT:-3000}
      # Below the 128m limit, so the Go runtime collects before the kernel
      # kills; collector.yaml's memory_limiter has the arithmetic.
      GOMEMLIMIT: 80MiB
    volumes:
      # Where the image reads its configuration from by default, so no
      # command is needed; the digest above is what keeps that default from
      # moving. create_host_path off, so a machine missing the file is a
      # refusal at `up` that names it. Docker would otherwise make an empty
      # directory called collector.yaml, and the collector would fail to read
      # it with a message about a directory.
      - type: bind
        source: ./collector.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
        bind:
          create_host_path: false
    # The image's own user, stated: non-root is this file's property rather
    # than whatever a later image happens to declare.
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: ["metrics"]
    restart: unless-stopped
    network_mode: host
    command:
      # The host's root, read-only, for the filesystem collector, which takes
      # the space of each mount from the mount itself. The whole root rather
      # than the mounts one by one, because which mounts a machine has is the
      # machine's business — the data volume is one, a hand install may have
      # more — and read-only as nobody, so it reads what any unprivileged user
      # on the machine could. /proc and /sys need no mount: their CPU, memory,
      # pressure and disk files are the kernel's and the same in every
      # container, and their network files follow the network namespace,
      # which is the host's.
      - --path.rootfs=/host
      - --path.udev.data=/host/run/udev/data
      # Loopback, on the host's network: the collector beside it, and nothing
      # off this machine.
      - --web.listen-address=127.0.0.1:9100
      # Its own Go and process series, which nobody here is watching it for.
      - --web.disable-exporter-metrics
      # Chosen rather than defaulted. The defaults are some forty collectors,
      # and every one is series sent and paid for; these are the questions a
      # two-machine deployment is actually asked.
      - --collector.disable-defaults
      # Busy, by mode: steal says the provider took the CPU back, iowait that
      # the disk is the limit rather than the code.
      - --collector.cpu
      # Available memory. The application node peaked at 745 MiB under the
      # capacity run, on a machine sized at four times that, so this is the
      # line to watch as the ledgers on it grow.
      - --collector.meminfo
      # Three series, and the oldest question anybody asks of a machine.
      - --collector.loadavg
      # Time stalled waiting for CPU, memory or I/O, which a utilization
      # figure averages away: a machine at 40% CPU can still be making every
      # request wait.
      - --collector.pressure
      # The OOM killer's own count, and major faults: a container killed for
      # memory shows here and nowhere else.
      - --collector.vmstat
      # Boot time, so a reboot is a step in a line rather than a guess, and
      # processes blocked on I/O.
      - --collector.stat
      # One series naming the kernel and the host, so two machines' figures
      # can be told apart in a backend that knows nothing about this profile.
      - --collector.uname
      # This machine's clock beside the collector's: "today" in somebody's
      # timezone is read off it, and so is every posting's date.
      - --collector.time
      # Space left, on the boot disk the container logs and images fill and
      # on the data volume. Real filesystems only, and nothing under /etc,
      # where Docker bind-mounts this container's own hosts, hostname and
      # resolv.conf from the root disk: each would read as a second copy of it.
      - --collector.filesystem
      - --collector.filesystem.fs-types-include=^(ext[234]|xfs|btrfs)$$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc)($$|/)
      # Reads, writes and time spent on each disk, the boot disk and the data
      # volume alike.
      - --collector.diskstats
      # Bytes, errors and drops on the machine's own NICs, by name: Docker's
      # bridges and every container's veth would otherwise add a set each.
      - --collector.netdev
      - --collector.netdev.device-include=^(eth|en).+$$
    environment:
      GOMEMLIMIT: 38MiB
    volumes:
      # rprivate, Docker's default, rather than the rslave upstream suggests:
      # every mount it needs is there before the unit starts, and a host whose
      # root is not a shared mount refuses rslave outright. The short form is
      # safe for this one: the root always exists, so there is nothing for
      # Docker to create in its place.
      - /:/host:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 48m
    logging: *logging
