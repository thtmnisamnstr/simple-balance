# Simple Balance's application machine: everything but the database.
#
# The application container docs/deployment.md calls the supported way to run
# this, and nothing else. No PostgreSQL here, and that is the point of the
# machine rather than a gap in it — losing this one loses no data. Point
# DATABASE_URL at the database machine beside it, which compose.postgres.yml in
# this same directory runs, or at a managed service, or at a server you already
# keep.
#
#   cp deploy/compose/single/.env.example deploy/compose/single/.env
#   $EDITOR deploy/compose/single/.env
#   docker compose -f deploy/compose/single/compose.yml up -d
#
# This is the `single` profile, and the name is about *shape* rather than about
# a machine count: one application node, one database node, no redundancy in
# either, and it grows by being given more CPU and memory. The other profile is
# `ha`, which is the Helm chart, in two shapes of its own.
# docs/deployment-profiles.md is the comparison, docs/deployment-sizing.md says
# how big each machine has to be, and docs/deployment-costs.md prices the pair.
#
# Not to be confused with ../compose.distributed.yml, which runs the *split*
# containers on one machine. That file exists to exercise the shape the Helm
# chart deploys; this one is a deployment somebody's books live in.
name: simple-balance

services:
  app:
    # The one container: the API, the MCP server, the browser bundle and the
    # recurrence scheduler. RECURRENCE_SCHEDULER is deliberately not passed
    # below: this is the only process there is, so turning it off would leave
    # recurrences that never propose.
    # Pinned rather than :latest, because an upgrade moves the schema and should
    # be a decision rather than whatever a restart happened to pull.
    image: ghcr.io/thtmnisamnstr/simple-balance:0.1.6
    restart: unless-stopped
    ports:
      # Loopback, always, and the bind address is what makes that true — not the
      # Caddy overlay.
      #
      # This comment said for a release that compose.caddy.yml "removes this
      # mapping entirely". It does not: an overlay merges lists rather than
      # replacing them, so with Caddy in front the application is published on
      # 127.0.0.1:3000 as well. That was harmless, because the address below is
      # loopback — but it was harmless by accident, and the argument for not
      # opening 3000 in either cloud firewall was resting on it.
      #
      # So the property to keep is this one: whatever is in front, the port is
      # published to this machine and to nothing else. Publishing 3000 to
      # 0.0.0.0 would serve the application over plain HTTP to anybody who found
      # the address, with the session cookie on it, and neither cloud program
      # opens 3000 to anything.
      #
      # `ports: !override []` in the Caddy overlay would drop the mapping
      # properly and is deliberately not used: it needs Compose 2.24, this file
      # is also a hand install recipe, and a YAML tag an older Compose does not
      # know is a parse error rather than a fallback. Keeping the mapping also
      # keeps `curl 127.0.0.1:3000/health/ready` working on the machine, which is
      # the first thing anybody does when the site is down.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"

    # The whole of what reaches the container: .env only fills in the ${...},
    # so a setting this block does not name is silently dropped.
    # tests/env-example.test.ts holds it to every name src/server reads.
    environment:
      # Set by the image already. Pinned here because unset reads as development
      # and that is the one misconfiguration with no symptom: no setup code, no
      # sign-in rate limiting, no secure cookies, and nothing said about it.
      NODE_ENV: production

      # Never this machine's own PostgreSQL, and that is the profile rather
      # than a limitation: losing this machine loses no data.
      #
      # Where the database lives is the one thing this file does not decide. On
      # the pair deploy/pulumi builds it is the database node, over the
      # provider's private network, under sslmode=verify-full against a
      # certificate that stack issued. It can equally be a managed service or a
      # server you already keep awake. `docs/deployment.md` has always described
      # this product as something you point at a database, and this is that
      # sentence as a compose file.
      #
      # A URL that names the database's CA certificate with sslrootcert needs
      # compose.db-tls.yml beside this file, which mounts the certificate's
      # directory. It is left out of here because a daemon that cannot make
      # that directory, a rootless one, would then start nothing at all.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/compose/single/.env}
      # Only behind a transaction pooler, which managed services often hand
      # out. Migrations and the first-account claim hold a session-level
      # advisory lock that a pooler cannot carry, so they connect here instead.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}

      # The origin a browser opens, which behind a terminator is its https:// URL
      # and not this container's port. The API sets the cookies the browser reads
      # and compares every state-changing request's Origin against this value, so
      # naming the wrong host here turns every write into a rejected
      # cross-origin request while the pages still load.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in deploy/compose/single/.env}

      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/compose/single/.env}
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Whether to believe X-Forwarded-For. There is no nginx in this profile —
      # the application serves its own pages — so the header comes from whatever
      # terminates TLS, and the API reads the first address in it.
      #
      # Defaulted to false and overridden to true by compose.caddy.yml, because
      # the answer is a property of what is in front rather than of this file.
      # Left true with nothing in front, a caller writes their own address and
      # gets as many sign-in attempts as they like; left false with something in
      # front, every visitor shares one allowance. The server says at startup
      # which of the two it is doing.
      TRUST_PROXY: ${TRUST_PROXY:-false}

      SMTP_HOST: ${SMTP_HOST:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"

      CSV_MAX_BYTES: "10485760"
      CSV_MAX_ROWS: "10000"

      # One process, so this deployment opens 10 + 1 = 11 of whatever
      # max_connections the database at DATABASE_URL allows. That is all this
      # profile ever asks of it: there is nothing to scale out, so the number
      # does not move unless the pool does.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

      RECURRENCE_TICK_SECONDS: "300"
      RECURRENCE_CATCH_UP_LIMIT: "50"
      RECURRENCE_CLAIM_LIMIT: "500"
      IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-}

      # Off unless asked for, and unpublished either way: nothing maps a host
      # port to it and no terminator in this profile proxies /metrics, so a
      # scraper has to be on this network. Set METRICS_TOKEN as well if you put
      # one there.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      SB_BILLING_ENABLED: ${SB_BILLING_ENABLED:-false}
      SB_CSP_REPORT_ONLY: ${SB_CSP_REPORT_ONLY:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY_ID: ${STRIPE_PRICE_MONTHLY_ID:-}
      STRIPE_PRICE_YEARLY_ID: ${STRIPE_PRICE_YEARLY_ID:-}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_BANNER_SLOT_ID: ${ADSENSE_BANNER_SLOT_ID:-}
      ADSENSE_FOOTER_SLOT_ID: ${ADSENSE_FOOTER_SLOT_ID:-}
      ADSENSE_CONSENT_MANAGED: ${ADSENSE_CONSENT_MANAGED:-false}
      # Optional, and linked from sign-in and every page whenever it is set;
      # required, as an absolute https:// address, the moment the AdSense ids
      # are set: the server refuses to start without it. This block once left
      # it out, so the value in .env never arrived and turning AdSense on took
      # the whole deployment down asking for a variable already set.
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      # Optional, the same shape, linked beside the policy and the renewal terms.
      TERMS_OF_USE_URL: ${TERMS_OF_USE_URL:-}

    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    # Longer than the 10s the process gives itself on SIGTERM
    # (DEFAULT_SHUTDOWN_DEADLINE_MS), so a restart is not killed mid-drain.
    stop_grace_period: 30s

    # Docker's default json-file driver keeps every line forever, and on a
    # machine whose boot disk is 20 GiB that is how the disk fills. Both numbers
    # are per container, and compose.caddy.yml repeats them for Caddy.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      # The first start against an empty database runs every migration under an
      # advisory lock before readiness opens. Kept in step with the chart's
      # startupProbe and the distributed recipe's start_period: whichever is
      # smallest decides how slow a first migration may be before somebody's
      # deployment restarts in the middle of one.
      start_period: 300s
      retries: 5
