# node-exporter's TLS on the `single` profile's database machine, which
# compose.postgres.yml mounts at /etc/node-exporter/web.yml when the `metrics`
# profile is on. Not a compose file: node-exporter reads it, through its
# --web.config.file flag, and re-reads it and the two files it names on every
# connection, so a certificate replaced on disk is served without a restart.
#
# TLS because the scrape crosses a machine. The application machine's
# collector reaches this one over the provider's private network, and that is
# the case AGENTS.md insists on TLS for, whatever the firewall says: the
# firewall decides who may connect, and only TLS decides whether what arrives
# is this machine's answer.
#
# The database's own certificate, rather than one of its own, so there is one
# CA to issue, deliver and rotate for this machine rather than two. The
# application machine already trusts that CA for PostgreSQL and its collector
# checks this listener against the same file. The certificate names the
# database machine's DNS name and its private address, and
# SB_METRICS_DATABASE_TARGET on the other machine has to be one of those two
# or verification fails, which is the point of it.
#
# The paths are the container's and not the host's. The directory behind them
# is a copy simple-balance-db-firstboot makes of db-tls, owned by the uid this
# exporter runs as; that script says why it is a copy rather than the files
# PostgreSQL reads.
tls_server_config:
  cert_file: /etc/node-exporter/tls/server.crt
  key_file: /etc/node-exporter/tls/server.key
  # 1.3 and nothing older. The one client is the collector, which is Go and
  # speaks it by default, and so does any curl a person points here by hand;
  # a floor at 1.2 would only keep the cipher suites a 1.3 handshake never
  # offers.
  min_version: TLS13
