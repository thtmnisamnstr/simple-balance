{{- $component := "frontend" -}}
{{- $name := include "simple-balance.componentName" (dict "root" . "component" $component) -}}
{{- $serverService := include "simple-balance.componentName" (dict "root" . "component" "server") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "simple-balance.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.commonAnnotations .Values.frontend.podAnnotations }}
      annotations:
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "simple-balance.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.frontend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "simple-balance.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "simple-balance.image" (dict "root" $ "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          env:
            # The API Service, in the cluster. Only the browser's origin is
            # public; this hop is internal and plain HTTP.
            - name: SB_API_ORIGIN
              value: http://{{ $serverService }}:{{ .Values.server.service.port }}
            - name: SB_FRONTEND_PORT
              value: {{ .Values.frontend.containerPort | quote }}
            - name: SB_MAX_UPLOAD_SIZE
              value: {{ .Values.frontend.maxUploadSize | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          {{- if gt (int .Values.frontend.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                # Only a wait. The load balancer and kube-proxy need a window
                # to stop sending this pod new connections, and until they have
                # had it a shutdown cuts requests that were still arriving.
                #
                # The drain itself needs no help: the runtime stops a container
                # with the signal its image declares, and this base image
                # declares SIGQUIT, which is nginx's graceful shutdown. An
                # earlier version of this hook ran `nginx -s quit` on the theory
                # that SIGTERM was coming — it is not — and then waited for the
                # pid file to disappear, which left the hook failing on a
                # container whose shell had already gone. The drain is bounded by
                # terminationGracePeriodSeconds either way.
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.frontend.preStopSleepSeconds }}
          {{- end }}
          {{- if .Values.frontend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.frontend.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.frontend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # nginx writes in all three places and the root filesystem is read
            # only, so each is an emptyDir that lives and dies with the pod.
            #
            # /etc/nginx/conf.d is where the image's entrypoint renders
            # default.conf.template at startup, after envsubst has put
            # SB_API_ORIGIN and the rest into it. Mounting over the directory
            # hides the image's own default.conf, which the rendered file was
            # going to overwrite anyway.
            #
            # /tmp holds the temp files a request body is spooled into, so a
            # CSV import the size of SB_MAX_UPLOAD_SIZE passes through there on
            # its way to the API: the unprivileged image overrides all five of
            # nginx's temp paths to /tmp so a non-root user can write them, and
            # the pid file goes there too. /var/cache/nginx is mounted against a
            # base image that stops doing that, since a read-only root would then
            # leave nginx with nowhere to spool and no way to say so.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
