{{- if .Values.database.enabled }}
{{/*
The cluster's own credentials, separate from the application's Secret.

Separate because they are read by different things for different reasons: these
three are consumed by Patroni to run PostgreSQL, while the application's Secret
is a set of environment variables the API and the scheduler receive wholesale.
Putting a superuser password into the Secret every application container gets as
environment is not something to do by accident.

A password already in the cluster is kept rather than regenerated — see
`simple-balance.databaseCredentials` — so `helm upgrade` does not roll the
superuser password out from under a running cluster and break replication. The
certificate below is kept the same way and for a sharper reason: a regenerated
one would be a different identity, and every API pod holding the old CA would
stop being able to connect at the moment of the upgrade.

The CA certificate is public and is here rather than in a ConfigMap so that one
object is the whole answer to "what identity does this cluster have". The API
and scheduler pods mount only that one key out of it; see their Deployments.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simple-balance.databaseSecretName" . }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" "database") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  superuser-password: {{ include "simple-balance.databaseSuperuserPassword" . | quote }}
  replication-password: {{ include "simple-balance.databaseReplicationPassword" . | quote }}
  application-password: {{ include "simple-balance.databaseApplicationPassword" . | quote }}
  # Not a PostgreSQL role: what Patroni's REST API demands before it will fail
  # over, switch over, restart or reinitialize a member.
  restapi-password: {{ include "simple-balance.databaseRestApiPassword" . | quote }}
  # Keyed the way Kubernetes keys a TLS secret, because that is what a reader
  # will expect and because `kubectl get secret -o jsonpath` recipes in the
  # runbook are written against those names. Not `type: kubernetes.io/tls`,
  # which would refuse the four passwords sharing the object.
  ca.crt: |
    {{- include "simple-balance.databaseCaCert" . | nindent 4 }}
  tls.crt: |
    {{- include "simple-balance.databaseServerCert" . | nindent 4 }}
  tls.key: |
    {{- include "simple-balance.databaseServerKey" . | nindent 4 }}
{{- end }}
