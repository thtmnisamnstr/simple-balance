{{- $component := "scheduler" -}}
{{- $name := include "simple-balance.componentName" (dict "root" . "component" $component) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.scheduler.autoscaling.enabled }}
  replicas: {{ .Values.scheduler.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "simple-balance.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.database.enabled }}
        {{- /*
        The CA this pod verifies the database against lives in the cluster's own
        Secret, so a rotated certificate has to roll this tier too. Rendered only
        with database.enabled, so a release that brings its own database has the
        pod template it always had and no rollout it did not ask for.
        */}}
        checksum/database-tls: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.scheduler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "simple-balance.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.scheduler.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "simple-balance.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.scheduler.podSecurityContext | nindent 8 }}
      {{- include "simple-balance.waitForDatabase" (dict "root" $ "component" .Values.scheduler) | nindent 6 }}
      containers:
        - name: scheduler
          image: {{ include "simple-balance.image" (dict "root" $ "image" .Values.scheduler.image) | quote }}
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.scheduler.containerSecurityContext | nindent 12 }}
          # The same ConfigMap and Secret the API reads, RECURRENCE_SCHEDULER
          # apart. This process calls the same getConfig(), which validates
          # every variable there is before it will start: a scheduler pod given
          # DATABASE_URL and nothing else fails on APP_BASE_URL and crashloops,
          # however little of the rest it goes on to use.
          envFrom:
            - configMapRef:
                name: {{ include "simple-balance.configMapName" . }}
            {{- /*
            A list rather than one entry, because with database.enabled the
            connection string comes from the Secret this chart builds while the
            rest of the credentials come from the operator's. One source renders
            exactly the line it always did; see simple-balance.secretRefs for why
            the order is the contract.
            */}}
            {{- range fromJsonArray (include "simple-balance.secretRefs" .) }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          ports:
            # Health checks and nothing else are mounted on this port, so a
            # Service pointed here by mistake cannot answer an API request.
            - name: health
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          {{- if .Values.scheduler.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: {{ .Values.scheduler.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.scheduler.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.scheduler.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.scheduler.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: {{ .Values.scheduler.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.scheduler.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.scheduler.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.scheduler.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.scheduler.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: {{ .Values.scheduler.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.scheduler.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.scheduler.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          {{- if .Values.database.enabled }}
          {{- /*
          The one file this container reads off disk. pg-connection-string opens
          the path in DATABASE_URL's sslrootcert while it parses the string, so a
          pod without this mount fails at startup rather than connecting to
          something it cannot verify.
          */}}
          volumeMounts:
            - name: database-ca
              mountPath: {{ dir (include "simple-balance.databaseCaPath" .) }}
              readOnly: true
          {{- end }}
      {{- if .Values.database.enabled }}
      volumes:
        {{- /*
        Projected by key. The Secret this comes from also holds the superuser,
        replication and Patroni passwords, and naming the one item is what keeps
        them out of a container that has no use for them — the pod never reads
        the Secret itself, the kubelet does, and only what is listed here lands
        on the filesystem.
        */}}
        - name: database-ca
          secret:
            secretName: {{ include "simple-balance.databaseSecretName" . }}
            items:
              - key: ca.crt
                path: {{ base (include "simple-balance.databaseCaPath" .) }}
      {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
