{{- if .Values.secret.create }}
{{/*
Every key here is handed to the API and the scheduler as an environment
variable, which is why an existingSecret has to be keyed the same way and hold
nothing else.

Named directly rather than through the helper the Deployments use, because that
one now answers a different question: with database.enabled an existingSecret
may sit beside this Secret rather than instead of it, and the pods read both.
This is the object this template creates, so its name cannot be the operator's.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simple-balance.ownSecretName" . }}
  labels:
    {{- include "simple-balance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.database.enabled }}
  {{/*
  Derived rather than asked for. The host is the coordinator group's leader
  Service, which Patroni keeps pointed at whichever pod is primary — so a
  failover moves the database the application talks to without the application
  being redeployed or even noticing. A worker is never named here: Citus routes.
  */}}
  DATABASE_URL: {{ include "simple-balance.databaseUrl" . | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  {{- /*
  Left out rather than written blank when it is empty, which happens only in the
  one combination where an existingSecret carries it: a blank AUTH_SECRET in the
  earlier envFrom source would be overwritten by the later one anyway, and a key
  whose value is a promise about another Secret is worse than no key.
  */}}
  {{- with .Values.secret.authSecret }}
  AUTH_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.directDatabaseUrl }}
  DIRECT_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.setupToken }}
  SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.smtpUsername }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
