{{- if .Values.secret.create }}
{{/*
Named through the same helper the Deployments use, so that naming an existing
Secret and leaving create on fails the render instead of building a second
Secret nothing reads.

Every key here is handed to the API and the scheduler as an environment
variable, which is why an existingSecret has to be keyed the same way and hold
nothing else.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simple-balance.secretName" . }}
  labels:
    {{- include "simple-balance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  AUTH_SECRET: {{ .Values.secret.authSecret | quote }}
  {{- with .Values.secret.directDatabaseUrl }}
  DIRECT_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.setupToken }}
  SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.smtpUsername }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
