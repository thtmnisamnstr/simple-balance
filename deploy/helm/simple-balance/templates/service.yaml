apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-balance.componentName" (dict "root" . "component" "server") }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.server.service.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.server.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  # ClusterIP: the API is reached through the frontend's nginx and never
  # directly, so that the browser and the API share one origin. Sessions live in
  # PostgreSQL rather than in the process, so nothing here needs affinity.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "simple-balance.componentSelectorLabels" (dict "root" . "component" "server") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-balance.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.frontend.service.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.frontend.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  # ClusterIP even though this is the public tier: the Ingress is what faces the
  # internet, and it reaches this Service from inside the cluster.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "simple-balance.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-balance.componentName" (dict "root" . "component" "scheduler") }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" "scheduler") | nindent 4 }}
  {{- if or .Values.commonAnnotations .Values.scheduler.service.annotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.scheduler.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  # Nothing should route to this. It exists to give the scheduler pods a stable
  # name for health checks and for whatever scrapes them, and the port is named
  # `health` for the same reason: the process serves /health/live and
  # /health/ready and mounts nothing else, so a Service pointed here in place of
  # the API's answers nothing.
  type: ClusterIP
  ports:
    - name: health
      port: {{ .Values.scheduler.service.port }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "simple-balance.componentSelectorLabels" (dict "root" . "component" "scheduler") | nindent 4 }}
