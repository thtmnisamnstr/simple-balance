{{- if and (include "simple-balance.collectorEnabled" .) .Values.collector.export.headers (not .Values.collector.export.existingSecret) }}
{{/*
The export headers, when they arrive as chart values. A Secret of the
collector's own rather than a key in the one the API and the scheduler read,
because every key of that one is in their environment: a backend's license key
there is a credential sitting in every application pod, readable from any of
them, for a process that never sends a byte to that backend.

JSON, because the collector reads the variable as YAML and a JSON object is
one, which keeps the value a single line however many headers it holds. The
cluster Pulumi programs build their own Secret instead and name it in
collector.export.existingSecret, for the reason the application's credentials
go that way: chart values land in the release's own Secret and in Helm's
history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simple-balance.collectorName" . }}
  labels:
    {{- include "simple-balance.componentLabels" (dict "root" . "component" "collector") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.collector.export.existingSecretKey }}: {{ toJson .Values.collector.export.headers | quote }}
{{- end }}
