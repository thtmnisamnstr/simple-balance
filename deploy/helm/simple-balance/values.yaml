# Simple Balance, as the three workloads deploy/docker/ builds: the API (which
# also serves MCP), the nginx frontend that serves the browser bundle and
# proxies everything the API owns, and the recurrence scheduler.
#
# The database is bring your own. This chart provisions no PostgreSQL and offers
# no in-cluster StatefulSet: it takes a DATABASE_URL and nothing else. If the
# database that string names does not exist the server creates it, which needs
# the connecting role to hold CREATEDB.

global:
  # Prefixed to every image repository below that names no registry of its own,
  # so a mirror is one setting rather than three.
  imageRegistry: ghcr.io

nameOverride: ""
fullnameOverride: ""

# Merged into the labels and annotations of every object the chart creates.
commonLabels: {}
commonAnnotations: {}

imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}
  # Nothing here talks to the Kubernetes API, so a mounted token would only be a
  # credential sitting in a pod with no use for it.
  automountServiceAccountToken: false

# Settings the API and the scheduler share. They become one ConfigMap that both
# Deployments read, because src/server/scheduler.ts calls the same getConfig()
# the API does and validates the whole variable set: a scheduler pod given only
# DATABASE_URL fails startup on APP_BASE_URL and crashloops.
config:
  # The FRONTEND's public origin, not the API's own address.
  #
  # Cookies are set by the API and read by the browser, so both have to be
  # reached on one origin, and that origin is the nginx container: every request
  # the browser makes arrives through it. Point this at the DNS name the Ingress
  # answers on. The API also compares the Origin header against this value on
  # every state-changing request, so a value naming the API Service instead
  # turns every write into a rejected cross-origin request.
  #
  # An exact origin: scheme and host, no path, no query, and HTTPS unless the
  # host is loopback.
  appBaseUrl: https://simple-balance.example.com

  # True because nginx is the address every connection to the API arrives from.
  # Left false behind a proxy, every visitor in the cluster shares a single
  # sign-in rate-limit allowance, which is one visitor's worth.
  #
  # Believable only while the frontend's nginx sets X-Forwarded-For to
  # $remote_addr rather than appending to whatever the caller sent. An ingress
  # terminating TLS in front of it makes $remote_addr the ingress and brings the
  # shared allowance back; NOTES.txt prints the set_real_ip_from fix.
  trustProxy: true

  # local, google, or both. Google needs config.google.clientId,
  # secret.googleClientSecret, and an allowedEmails list that admits somebody.
  authMode: local

  # Who may register, comma separated: addresses, domains (example.com), or *
  # for anybody. Empty admits nobody but the first account, which is what keeps
  # an unconfigured deployment private.
  allowedEmails: ""

  logLevel: info

  # The port both node processes listen on. The images set it to 3000; changing
  # it here moves the container ports, the probes and the Services together.
  port: 3000

  # The largest CSV import, in bytes, and the row cap that goes with it. The row
  # cap is also the most any one mass edit, commit or delete covers, so an
  # import always fits a single review-queue action and there is nothing to gain
  # by raising it past 10000.
  #
  # Raising csvMaxBytes means raising frontend.maxUploadSize, the ingress body
  # annotation, and the server's memory limit along with it. See all three.
  csvMaxBytes: 10485760
  csvMaxRows: 10000

  # Connections each process holds open. Two others exist and neither is held:
  # migrations take one at startup and close it, and the first-account claim
  # takes one once in a deployment's life.
  #
  # The peak, which is the number that has to fit, is while replicas start:
  #
  #   replicas x (databasePoolSize + 1)  <  max_connections
  #
  # PostgreSQL defaults max_connections to 100, so at a pool of 10 that is nine
  # replicas, not ninety, and the API and the scheduler both count against it.
  # This chart's own ceilings are four API replicas and two scheduler replicas,
  # which at a pool of 10 come to 6 x 11 = 66 of the 100. Lower this before
  # raising either ceiling, or put a connection pooler in front of PostgreSQL and
  # set secret.directDatabaseUrl.
  databasePoolSize: 10

  # How often a scheduler pod sweeps the due list, how many occurrences one
  # recurrence catches up per tick, and how many recurrences one tick claims.
  recurrence:
    tickSeconds: 300
    catchUpLimit: 50
    claimLimit: 500

  google:
    # The secret half of this pair is secret.googleClientSecret.
    clientId: ""

  # Mail is optional and everything needing it degrades rather than breaks: with
  # no host there is no password reset, nobody is asked to confirm an address,
  # and no scheduled reminder is sent — the setting is still stored and starts
  # arriving once a host is set, but nothing queues in the meantime. host and
  # from are set together or not at all. The scheduler Deployment reads this
  # block from the same ConfigMap the API does, so it needs nothing extra.
  mail:
    host: ""
    from: ""
    replyTo: ""
    port: 587
    # True only for a connection encrypted from the first byte, which is port
    # 465. False starts in the clear on 587 and upgrades with STARTTLS.
    ssl: false

  # Prometheus metrics, off unless asked for. Turning this on makes both
  # workloads answer GET /metrics on their own port, in Prometheus' text format.
  # Scrape both: the API reports requests, tool calls and ledger writes, and the
  # scheduler reports ticks, proposals and mail, so scraping only the API
  # watches the process that does none of the scheduled work. The Service does
  # not publish a separate port for it and the frontend does not proxy it, so a
  # scrape reaches the pods directly. The token half is secret.metricsToken.
  metrics:
    enabled: false

  # Anything else the API and the scheduler should read, as name/value pairs.
  extraEnv: {}

# DATABASE_URL and AUTH_SECRET, and the other credentials when they apply.
#
# Either the chart creates this Secret or the operator names one that already
# exists. Setting both fails the render rather than quietly picking one.
secret:
  create: true

  # A Secret that already exists in the release namespace. Its keys have to be
  # named exactly as the environment variables are: DATABASE_URL, AUTH_SECRET,
  # and whichever of DIRECT_DATABASE_URL, GOOGLE_CLIENT_SECRET, SMTP_USERNAME,
  # SMTP_PASSWORD and SETUP_TOKEN apply. Every key it carries reaches the API
  # and the scheduler as an environment variable, so it must hold nothing else.
  #
  # Set secret.create=false alongside it.
  existingSecret: ""

  # Read only when create is true.
  databaseUrl: ""
  # A connection string that reaches PostgreSQL past a transaction pooler.
  # PgBouncer in transaction mode suits the application pool, but migrations and
  # the first-account claim hold session-level advisory locks, and through a
  # pooler those are taken on one connection and released on another, which is
  # to say not held at all. Leave it empty when there is no pooler.
  directDatabaseUrl: ""
  # Generate one and keep it: openssl rand -base64 32. Sessions are signed with
  # it, so changing it signs everybody out. Startup refuses the published
  # placeholders, so there is nothing to leave in place by accident.
  authSecret: ""
  # Optional: choose the one-time code that claims the first account rather than
  # reading a generated one out of the server's startup log. At least 16
  # characters, or startup refuses it. Read only when create is true — with an
  # existingSecret, put SETUP_TOKEN in that Secret instead.
  #
  # Left empty, one is generated and stored, so every replica agrees on it and
  # the code in the log is the code the form accepts.
  setupToken: ""

  # Demanded by GET /metrics before it answers, as `Authorization: Bearer`.
  # Optional: leave it empty when a NetworkPolicy already decides who may reach
  # the pods, and set it when anything you do not control can.
  metricsToken: ""
  googleClientSecret: ""
  # Set together or not at all.
  smtpUsername: ""
  smtpPassword: ""

  # The two Stripe values that are secrets. The publishable key and the two
  # price ids are not — they are published to every visitor by design — so they
  # belong in `config.extraEnv` beside SB_BILLING_ENABLED rather than here.
  stripeSecretKey: ""
  stripeWebhookSecret: ""

server:
  image:
    # Falls back to global.imageRegistry when empty.
    registry: ""
    repository: thtmnisamnstr/simple-balance-server
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Ignored once autoscaling.enabled is true, so the HPA owns the count.
  replicaCount: 2

  # Requests are what an idle API replica actually holds. The memory limit is
  # sized off config.csvMaxBytes: a CSV arrives as a JSON string, the API sizes
  # its body limit for those routes at csvMaxBytes x 6 plus 64 KiB, and parsing
  # holds the encoded document and the decoded rows at once. At the default
  # 10 MiB that is a ~60 MiB body and several times that live while it is
  # parsed. Raise this limit whenever csvMaxBytes goes up, or a large import is
  # OOM-killed instead of refused.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    # The `node` user in the image.
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # The process writes nothing to disk. PostgreSQL is the only persistent
    # dependency there is.
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Above the 10s drain deadline the process gives itself on SIGTERM
  # (DEFAULT_SHUTDOWN_DEADLINE_MS), so the pod is not killed mid-drain.
  terminationGracePeriodSeconds: 30

  # The first start against an empty database runs every migration under an
  # advisory lock before readiness opens. The startup probe is what keeps the
  # liveness probe from killing that: failureThreshold x periodSeconds is the
  # budget, five minutes here.
  startupProbe:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  service:
    port: 3000
    annotations: {}

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    # Either target may be null to leave that metric out. Both null is an HPA
    # that cannot scale anything, and fails the render.
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Node's heap comes down long after the burst that filled it, so a short
    # window scales the tier down on memory that is about to be reclaimed and
    # back up on the next import.
    scaleDownStabilizationWindowSeconds: 300
    scaleUpStabilizationWindowSeconds: 0

  podDisruptionBudget:
    enabled: true
    # Set one of these, not both.
    minAvailable: ""
    maxUnavailable: 1

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

frontend:
  image:
    registry: ""
    repository: thtmnisamnstr/simple-balance-frontend
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  # 8080 and not 80: the nginx-unprivileged base image runs as a non-root user,
  # which cannot bind a privileged port.
  containerPort: 8080

  # The largest request body nginx passes through. A CSV arrives as a JSON
  # string, and the API sizes its own limit for those routes at
  # config.csvMaxBytes x 6 plus 64 KiB for worst-case escaping, which is ~60 MiB
  # at the 10 MiB default. Under that, nginx refuses a CSV the API behind it
  # would have taken. Raise it with config.csvMaxBytes.
  maxUploadSize: 61m

  # Whether Stripe is configured for this deployment. nginx needs to know, and
  # this is not a duplicate of the server's setting: in this shape nginx serves
  # the application shell itself, so it decides the content security policy the
  # plan tab arrives with — and Stripe's payment form loads a script and an
  # iframe from Stripe that every other page forbids. Set on the server and not
  # here, the tab opens and the card fields never appear.
  #
  # Configured, not selling. An operator winding down sets the server's
  # SB_BILLING_ENABLED to false and keeps the Stripe settings, and their
  # subscribers still have to be able to replace an expired card on that page.
  billingConfigured: false

  # Whether that page reports its content security policy instead of enforcing
  # it. Only meaningful with billingConfigured, and only for that one page.
  # nginx serves the document here, so this is the copy that decides which
  # header it arrives with; the server's own SB_CSP_REPORT_ONLY registers the
  # endpoint the reports land on. Set both, or the rehearsal looks live and
  # collects nothing.
  cspReportOnly: false

  # Whether this deployment serves advertising. nginx serves every document
  # here, so it decides the policy they arrive with, and AdSense needs a
  # materially wider one — scripts, frames and connections to any HTTPS origin.
  # Set it with the server's own ADSENSE_* settings or neither.
  adsConfigured: false

  # Which addresses this nginx will believe about where a request came from.
  #
  # Everything it proxies to the API carries X-Forwarded-For set to the address
  # it saw, and behind an ingress that terminates TLS that address is the
  # ingress — the same value for every visitor in the cluster. With
  # config.trustProxy on, the API then counts every sign-in attempt against one
  # allowance, and one stranger can spend it for everybody.
  #
  # Set this to the ingress controller's pod CIDR and $remote_addr resolves back
  # to the visitor. Not the whole cluster CIDR and never 0.0.0.0/0: this decides
  # whose word is taken for the address, so a range that includes callers lets a
  # caller name themselves.
  #
  # 127.0.0.1 is the off position, not a trusted range. Nothing reaches the
  # container from loopback, so the behaviour is exactly what it was before this
  # setting existed. It carries a value rather than an empty string because
  # `set_real_ip_from ;` is a configuration error and the container would not
  # start.
  trustedProxyCidr: 127.0.0.1

  # How long to keep answering after Kubernetes decides this pod is going, so
  # the load balancer and kube-proxy have stopped handing it new connections
  # before anything shuts down. 0 removes the hook.
  #
  # Only the waiting is here. nginx drains on its own: the runtime stops a
  # container with the signal its image declares, and the frontend image declares
  # SIGQUIT, which is nginx's graceful shutdown. What bounds that drain is
  # terminationGracePeriodSeconds below, so raise that one if long MCP streams
  # matter more than quick rollouts.
  preStopSleepSeconds: 5

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true
    # The `nginx` user in the nginx-unprivileged image.
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # The whole shutdown budget: preStopSleepSeconds first, then however long nginx
  # needs to finish its open responses. A request still streaming when this
  # expires is cut, so anyone holding long MCP streams open should raise it.
  terminationGracePeriodSeconds: 30

  # Probes / rather than /health, because that location is served by nginx out
  # of the bundle it ships: it says whether this container works rather than
  # whether the API behind it does. A frontend pulled out of rotation while the
  # database is down would serve nobody the page that says so.
  readinessProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

  service:
    port: 80
    annotations: {}

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationWindowSeconds: 300
    scaleUpStabilizationWindowSeconds: 0

  podDisruptionBudget:
    enabled: true
    minAvailable: ""
    maxUnavailable: 1

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

scheduler:
  image:
    registry: ""
    repository: thtmnisamnstr/simple-balance-scheduler
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # No CSV parsing reaches this process, so the ceiling that sizes the API does
  # not apply. What it does is sweep the due list and write staged rows.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  terminationGracePeriodSeconds: 30

  # This entrypoint runs the same migrations the API does, so a scheduler pod
  # scheduled first works rather than failing on tables that do not exist yet.
  # It needs the same protection from the liveness probe while it does.
  startupProbe:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  service:
    port: 3000
    annotations: {}

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Worth knowing what this can and cannot do. Replicas divide the due list by
    # claiming rows, so more of them genuinely is more throughput on a backlog.
    # What CPU cannot see is the backlog itself: a sweep is a burst that ends,
    # and a tier idle between ticks reads as a tier with nothing to do. So this
    # answers a scheduler that is busy for a sustained stretch, which is the
    # case that matters, and leaves a single tick's spike alone.
    #
    # Wider than the API's, because the load being measured is a sweep that runs
    # once every config.recurrence.tickSeconds and then stops. A window shorter
    # than the tick interval scales the tier down on the quiet gap and back up
    # on the next sweep, forever.
    scaleDownStabilizationWindowSeconds: 600
    scaleUpStabilizationWindowSeconds: 0

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# One Ingress, pointed at the frontend Service. Nothing routes to the API
# directly: it is reached through nginx so the browser and the API share one
# origin, which is the origin config.appBaseUrl names.
ingress:
  enabled: false
  className: nginx
  annotations:
    # ingress-nginx caps a body at 1 MiB, which refuses a CSV import long before
    # it reaches the nginx inside the frontend container, let alone the API.
    # Keep this in step with frontend.maxUploadSize. Other controllers spell it
    # differently: HAProxy uses haproxy.org/client-body-size, Traefik imposes no
    # limit of its own, and a cloud load balancer may cap it outside Kubernetes
    # altogether.
    nginx.ingress.kubernetes.io/proxy-body-size: 61m
  host: simple-balance.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # Defaults to <fullname>-tls. cert-manager fills it; nothing else should.
    secretName: ""
    # A cluster-wide ClusterIssuer, or issuer for a namespaced one. Set one.
    clusterIssuer: letsencrypt-production
    issuer: ""

# Off by default: a policy naming the wrong ingress controller black-holes the
# site silently, and the labels that name it differ per cluster.
networkPolicy:
  enabled: false

  # Who may reach the frontend. Empty allows any source in the cluster to reach
  # the frontend port, which is the honest default when the chart cannot know
  # how the ingress controller is labelled. Standard NetworkPolicyPeer entries:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  frontendIngressFrom: []

  # Anything besides the frontend that may reach the API: a metrics scraper, an
  # MCP client inside the cluster. Same shape as above.
  serverIngressFrom: []

  # Who may reach the scheduler, which serves health probes and, with
  # config.metrics.enabled, /metrics. Empty allows any source in the cluster on
  # that port; naming probeSourceCidrs narrows it to those, and a scraper then
  # has to be named here or it cannot reach the process that reports ticks,
  # proposals and mail. Same shape as above.
  schedulerIngressFrom: []

  # kubelet runs the probes from the node's own address. Some CNIs hold these
  # rules against that traffic and others exempt it, so if probes start failing
  # the moment this is switched on, put the node CIDR here.
  probeSourceCidrs: []

  # Egress is left open because the chart cannot know where any of it goes: the
  # database is bring your own, and Google sign-in and SMTP are addresses on the
  # internet. Turn this on and supply egressRules to close it.
  restrictEgress: false
  # Raw NetworkPolicyEgressRule entries, read only when restrictEgress is true.
  # DNS and the frontend's hop to the API are added for you; everything else,
  # the database included, has to be listed here.
  egressRules: []

# The `ha` profile's database: PostgreSQL 18 with Citus, run by Patroni.
#
# Off by default, and that is not a hedge. Every release before this one expected
# a DATABASE_URL you supply, and the two other profiles still do — `single`
# points at a database somebody else runs, `vps` at one beside it in Compose.
# Turning this on is choosing to let the chart run your database, which is a
# different undertaking from running the application, and `docs/citus-runbook.md`
# is the operational half of it.
#
# Citus supplies no high availability of its own: `shard_replication_factor > 1`
# is deprecated, documented as not an HA mechanism, and breaks
# `SELECT ... FOR UPDATE`. Redundancy here is therefore a streaming standby per
# node, and Patroni is what promotes one. Patroni has understood Citus since 3.0
# — it registers a worker with `citus_add_node` and pauses coordinator traffic
# across a worker switchover with `citus_update_node` — which is why this is
# Patroni rather than something written here.
database:
  enabled: false

  image:
    # Falls back to global.imageRegistry when empty.
    registry: ""
    repository: thtmnisamnstr/simple-balance-citus
    # Names Citus and PostgreSQL rather than the application version, because
    # that is whose version it is. There is deliberately no `latest`: a
    # PostgreSQL major version cannot read the previous major's data directory,
    # so a floating tag turns an image pull into an outage.
    tag: "14.2.0-pg18"
    # Pin this as well for a production cluster. A tag is a name; a digest is the
    # thing.
    digest: ""
    pullPolicy: IfNotPresent

  # The database Citus distributes and the application connects to. Patroni
  # creates it; `0023_citus_distribution.sql` distributes it on first start.
  databaseName: simple_balance

  # Citus groups. The coordinator is group 0 and always exists; this is how many
  # worker groups sit beside it. Two is the smallest number that shows the
  # ledger actually spread across nodes rather than merely being able to.
  workers: 2

  # Replicas in every group: one primary, the rest streaming standbys. One means
  # no redundancy at all — a node lost is that group's shards gone until it comes
  # back — so anything calling itself `ha` wants at least two.
  replicasPerGroup: 2

  # Left empty, each is generated once and kept in the release's Secret, so a
  # `helm upgrade` does not roll the passwords out from under a running cluster.
  superuser:
    username: postgres
    password: ""
  replication:
    username: standby
    password: ""
  # The role the application connects as. Not the superuser: a ledger's
  # application role should not be able to rewrite the cluster's own metadata.
  # Created on first bootstrap and made owner of the database.
  application:
    username: simple_balance
    password: ""

  persistence:
    enabled: true
    size: 20Gi
    # Empty uses the cluster's default. Name one that is not delete-on-release
    # for anything real.
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Extra postgresql.conf settings, merged over the ones this chart sets.
  # `docs/deployment-sizing.md` has what to put here for a given machine.
  parameters: {}

  resources: {}
  nodeSelector: {}
  tolerations: []
  # Left as an object so it can be replaced wholesale. The default spreads the
  # replicas of one Citus group across nodes, which is the arrangement that makes
  # a standby worth having: two replicas of group 1 on one node is a group with
  # no redundancy and a chart that claims otherwise.
  affinity: {}

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  # Every commit waits for a standby to hold the WAL before it is acknowledged,
  # so promoting a standby cannot lose a transaction the application was told had
  # committed. This is the trade this profile makes for money: a write pays one
  # network round trip inside the cluster. Turn it off and a failover can lose
  # the last few transactions, which for a ledger means the books disagree with
  # what somebody was shown.
  #
  # It falls back to asynchronous when no standby is available rather than
  # refusing writes, so one lost pod degrades the guarantee instead of stopping
  # the deployment. `docs/citus-runbook.md` says how to see which state you are
  # in, and how to make it strict if you would rather stop.
  synchronousReplication: true

  # Patroni's REST API, which is also how the pods find each other.
  restApiPort: 8008
