# The headers for `/settings/plan`, the one page nginx serves that may need a
# wider content security policy: it mounts Stripe's payment form, which loads a
# script and an iframe from Stripe.
#
# A whole second copy of the header list rather than the first file plus an
# override, because nginx `add_header` does not merge — a location that declares
# one directive drops every inherited one, so a partial file would serve that
# page with a policy and none of the other nine headers.
#
# The policy itself comes from `$sb_plan_csp`, set by a map in the template, so a
# deployment that sells nothing serves this path under exactly the strict policy
# every other page gets. `tests/security-header-parity.test.ts` compares both
# values against what `securityHeaderOptions` produces for each surface, which
# is what keeps two copies in two languages from drifting.
add_header Content-Security-Policy $sb_plan_csp always;
# The rehearsal, when SB_CSP_REPORT_ONLY is on. Exactly one of these two carries
# a value; nginx omits an add_header whose value is empty, so the page gets one
# header or the other and never both.
add_header Content-Security-Policy-Report-Only $sb_plan_csp_report_only always;
add_header Reporting-Endpoints $sb_csp_reporting_endpoints always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# Zero, deliberately: it switches off the legacy XSS auditor, whose heuristics
# introduced holes of their own. The content security policy is the defence.
add_header X-XSS-Protection "0" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
