# The headers the API sets on its own responses through Hono's secureHeaders,
# repeated for the files nginx serves itself. The application shell and the
# hashed assets never reach the API process, so without this the one document
# that actually runs the app ships with no policy at all.
#
# Included rather than set at server level because nginx drops inherited
# add_header directives from any level that declares one of its own, and both
# static locations declare Cache-Control. Included in those two and not in the
# proxy location, so an API response carries one policy rather than two.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# The rest of what Hono's secureHeaders puts on an API response. Left out, the
# one document that actually runs the app was the only response on the origin
# without them, which is the opposite of the intent.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# Zero, deliberately: it switches off the legacy XSS auditor, whose heuristics
# introduced holes of their own. The content security policy is the defence.
add_header X-XSS-Protection "0" always;
# Ignored by browsers over plain HTTP, which is how this container is reached
# from the ingress that terminates TLS, and honoured on the HTTPS response that
# same ingress returns.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
