name: simple-balance-oci-single
runtime:
  name: nodejs
  options:
    typescript: true
description: >-
  Simple Balance's `single` profile on one Oracle Cloud compute instance: a VCN
  with one public subnet, a security list that opens 80 and 443 and nothing
  else, a block volume the database lives on, a reserved public IP, and an
  Ampere A1 shape sized from the same table the AWS program uses. The
  application, PostgreSQL and Caddy all run on the instance under systemd.
